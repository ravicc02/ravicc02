name: Contribution graphs

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/contribution-graphs.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            contribution-graphs/github-contribution-grid-snake.svg
            contribution-graphs/github-contribution-grid-snake-light.svg?palette=github-light
            contribution-graphs/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Publish graphs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- contribution-graphs/*.svg profile-3d-contrib/profile-green-animate.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution graphs"
            git push
          fi
